<!DOCTYPE html>
<html>
<head>
  <title>Abdelrahman Browser</title>
  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Tabs Bar */
    #tabs-container { display: flex; background: #1e1e1e; padding: 8px 8px 0 8px; gap: 4px; overflow-x: auto; }
    .tab { display: flex; align-items: center; background: #2d2d2d; color: #aaa; padding: 8px 12px; border-radius: 8px 8px 0 0; max-width: 200px; min-width: 100px; cursor: pointer; font-size: 12px; }
    .tab.active { background: #3c3c3c; color: white; }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .close-tab { margin-left: 10px; background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 14px; padding: 0; }
    .close-tab:hover { color: white; }
    #new-tab-btn { background: transparent; border: none; color: #aaa; font-size: 18px; cursor: pointer; padding: 0 10px; }
    #new-tab-btn:hover { color: white; }

    /* Top Toolbar */
    .toolbar { display: flex; padding: 8px; background: #3c3c3c; gap: 8px; align-items: center; border-bottom: 1px solid #444; }
    button.nav-btn { background: transparent; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
    button.nav-btn:hover { background: #555; color: white; }
    input { flex: 1; padding: 8px 15px; border-radius: 20px; border: none; background: #1e1e1e; color: white; outline: none; font-size: 14px; }
    input:focus { box-shadow: 0 0 0 2px #2563eb; }
    
    /* Bookmarks Bar */
    .bookmarks { display: flex; padding: 4px 10px; background: #2d2d2d; gap: 15px; font-size: 12px; border-bottom: 1px solid #444; }
    .bookmarks span { color: #888; cursor: pointer; transition: 0.2s; }
    .bookmarks span:hover { color: #60a5fa; text-decoration: underline; }

    /* Webviews */
    #webviews-container { flex: 1; position: relative; background: #fff;}
    webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    webview.active { display: flex; }

    /* Incognito Theme */
    .incognito .toolbar { background: #202124; }
    .incognito .tab.active { background: #202124; }
    .incognito body { background: #202124; }
  </style>
</head>
<body>
  <!-- Tabs -->
  <div id="tabs-container">
    <button id="new-tab-btn">+</button>
  </div>

  <!-- Top Toolbar -->
  <div class="toolbar">
    <button class="nav-btn" id="back">◀</button>
    <button class="nav-btn" id="forward">▶</button>
    <button class="nav-btn" id="reload">↻</button>
    <button class="nav-btn" id="home" title="Home">🏠</button>
    <input type="text" id="urlbar" placeholder="Search Google or type a URL">
    <button class="nav-btn" id="incognito" title="Incognito Mode">🕶️</button>
    <button class="nav-btn" id="downloads" title="Downloads">⬇️</button>
    <button class="nav-btn" id="devtools" title="DevTools">🛠</button>
    <button class="nav-btn" id="settings" title="Settings">⚙️</button>
  </div>

  <!-- Bookmarks Bar -->
  <div class="bookmarks">
    <span onclick="navigateActiveTab('http://192.168.1.10')">HFS Server</span>
    <span onclick="navigateActiveTab('https://youtube.com')">YouTube</span>
    <span onclick="navigateActiveTab('https://github.com')">GitHub</span>
  </div>

  <div id="webviews-container"></div>
  <script src="renderer.js"></script>
</body>
</html>
